title: Subnovel
description: Proyek terjemahan novel web ke dalam bahasa Indonesia.
lang: id
url: https://mieburungdara.github.io
baseurl: /subnovel
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Setiap novel adalah satu collection. Tambahkan folder baru di _<slug>/
# dan daftarkan slug-nya di bawah `novels` untuk menampilkannya di beranda.
collections:
  absolute-regression:
    output: true
    permalink: /:year/:month/:day/:title.html
  novel-dua:
    output: true
    permalink: /novel-dua/:year/:month/:day/:title.html

novels:
  absolute-regression:
    title: Absolute Regression
    description: Terjemahan novel web Absolute Regression ke dalam bahasa Indonesia.
    source: https://fenrirealm.com/series/absolute-regression
    path: /absolute-regression/
    feed: /feed.xml
  novel-dua:
    title: Novel Dua
    description: Ganti judul dan deskripsi novel ini di _config.yml.
    source: ""
    path: /novel-dua/
    feed: /novel-dua/feed.xml

plugins:
  - jekyll-feed

feed:
  posts_limit: 20
  collections:
    absolute-regression:
      path: /feed.xml
    novel-dua:
      path: /novel-dua/feed.xml
    posts:
      path: /posts.xml

defaults:
  - scope:
      path: ""
      type: absolute-regression
    values:
      layout: default
  - scope:
      path: ""
      type: novel-dua
    values:
      layout: default

exclude:
  - chapter/
  - GEMINI.md
  - README.md
  - script/
  - tmp/
  - vendor/
