title: Subnovel
description: Proyek terjemahan novel web ke dalam bahasa Indonesia.
lang: id
url: https://mieburungdara.github.io
baseurl: /subnovel
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
plugins:
  - jekyll-feed
feed:
  posts_limit: 20
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: default
exclude:
  - chapter/
  - GEMINI.md
  - README.md
  - script/
  - tmp/
  - vendor/
